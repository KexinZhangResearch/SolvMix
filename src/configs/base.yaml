# SolvMix v5-style base configuration

defaults:
  - _self_
  - optional experiments: null

# Experiment meta
proj_name: SolvMix_Electrolyte
exp_name: solvmix_min_amount_scale
seed: 42
test_only: false
compile: false

# Data
data:
  dataset_name: GeoMix_CALiSol
  batch_size: null
  max_samples: 100000
  num_workers: 8
  seq_len: 16
  train_ratio: 0.7
  val_ratio: 0.2

# Model
model:
  hidden_dim: 64
  num_gnn_blocks: 3
  num_atom_blocks: 0
  num_mlp_layer: 3
  num_token_blocks: 3
  num_atten_head: 4

  # Concentration gate: unbounded amount-conditioned scale
  use_amount_scale: false

  # Adds type embedding + separate solvent/salt amount embeddings before scatter
  use_amount_and_type_emb: false

  # Learnable residual scale for GNN blocks
  use_res_scale: false

  # Condition mode: late_concat (default) or in_context
  cond_mode: late_concat

# Training
train:
  epochs: 50000
  learning_rate: 5.0e-4
  weight_decay: 1.0e-4
  optimizer: AdamW
  warmup_steps: 100
  lr_gamma: 0.99985
  grad_clip_val: 0.25

  devices: 1
  precision: "32"
  test_interval: 10

  use_ema: true
  ema_decay: 0.999

# Wandb
wandb_api_key: null
wandb_offline: false

hydra:
  job:
    chdir: false
