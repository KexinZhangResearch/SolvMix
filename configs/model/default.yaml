model:
  graph_hidden_dim: 64
  num_conv_layer: 3
  num_mlp_layer: 3
  num_atten_layer: 3
  num_atten_head: 4
  num_atom_interaction_layer: 1
  dropout: 0.05
  att_dropout: 0.0
  resid_dropout: 0.05
  ffn_mult: 4.0
  norm_type: layernorm
  cond_mode: in_context
  token_pool: global
  use_type_emb: true
  use_amount_emb: true
  use_relation: false
  use_relation_attn: true
  relation_dim: 16
  use_decomp: true
  use_global_token: true
  atom_mod_mode: none
  token_block_mod: none
  separate_amount_emb: true
